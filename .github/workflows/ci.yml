name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Use the repository npm version
        run: npm install --global npm@11.18.0
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test credential storage
        run: npm test

  mqtt-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: mqtt_isolation
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check MQTT row isolation in a disposable database
        env:
          PGPASSWORD: disposable-test-password
        run: psql -h localhost -U postgres -d mqtt_isolation -f tests/mqtt-rls.sql
